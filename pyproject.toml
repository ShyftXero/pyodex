[project]
name = "pyext"
version = "0.1.0"
description = "Framework for building Chrome (MV3) extensions whose logic runs in Python via Pyodide."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pyext = "pyext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyext"]

[dependency-groups]
dev = ["ruff>=0.6"]
