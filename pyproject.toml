[project]
name = "pyodex"
dynamic = ["version"]
description = "Framework for building Chrome (MV3) extensions whose logic runs in Python via Pyodide."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pyodex = "pyodex.cli:main"

[tool.hatch.version]
path = "src/pyodex/_version.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyodex"]

[tool.hatch.build.targets.sdist]
exclude = ["/examples/experimental/17-ssh", "/tests/iwa_ssh_smoke.py"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "websockets>=13",
    "playwright>=1.65.2",
]
