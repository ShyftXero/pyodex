<link rel="stylesheet" href="prompt.css">
<main class="ssh-app">
  <header>
    <h1>SSH terminal</h1>
    <p>Demo 17 · OpenSSH WebAssembly · Chrome Direct Sockets</p>
  </header>
  <!-- pyodex-submit.prevent: Python handles submit, the page does not navigate.
       The attribute holds a handler name, never code: MV3 forbids inline JS. -->
  <form id="connection" pyodex-submit.prevent="connect">
    <label>Host <input id="host" placeholder="example.net" required maxlength="253" spellcheck="false"></label>
    <label>User <input id="user" required maxlength="64" spellcheck="false" autocomplete="username"></label>
    <label>Port <input id="port" type="number" min="1" max="65535" value="22" required></label>
    <button id="connect" disabled>Connect</button>
    <button id="disconnect" type="button" disabled pyodex-click="disconnect">Disconnect</button>
  </form>
  <p id="connection-status" role="status">Starting Python…</p>
  <div id="terminal" aria-label="SSH terminal"></div>
  <dialog id="pyodex-ssh-prompt" aria-labelledby="pyodex-ssh-prompt-title" aria-describedby="pyodex-ssh-prompt-message">
    <form id="pyodex-ssh-prompt-form" method="dialog">
      <h2 id="pyodex-ssh-prompt-title">SSH prompt</h2>
      <p id="pyodex-ssh-prompt-target" class="pyodex-ssh-target"></p>
      <p id="pyodex-ssh-prompt-message"></p>
      <label>Response <input id="pyodex-ssh-prompt-answer" autocomplete="off" spellcheck="false"></label>
      <div class="pyodex-ssh-actions">
        <button id="pyodex-ssh-prompt-cancel" type="button">Cancel connection</button>
        <button>Continue</button>
      </div>
    </form>
  </dialog>
</main>
