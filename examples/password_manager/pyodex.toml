[extension]
name = "Pyodex Vault"
description = "Watches every page for login forms and offers to fill them."
matches = ["<all_urls>"]
# No boot/trigger config here on purpose: main.py declares what it needs with
# @watch_for / @on_event, and the build derives the page behaviour from that.
reap_hidden_after = 0   # once awake on a login page, stay resident
http = true
